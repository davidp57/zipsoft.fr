.bg-t{stop-color:#1b2430}.bg-b{stop-color:#141b24}
.i{stroke:#a9bfdc}.a{stroke:#e58c4f}.f{fill:#a9bfdc}.fa{fill:#e58c4f}.d{fill:#a9bfdc;opacity:.12}
}
</style>

.f{fill:#1d5a53}.fa{fill:#c2662d}.d{fill:#1d5a53;opacity:.13}
@media (prefers-color-scheme: dark){
.bg-t{stop-color:#16231f}.bg-b{stop-color:#101a17}
.i{stroke:#8fd0c4}.a{stroke:#e58c4f}.f{fill:#8fd0c4}.fa{fill:#e58c4f}.d{fill:#8fd0c4;opacity:.12}
}
</style>

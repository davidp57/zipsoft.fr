<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Iron Gall: a drop of iron-gall ink filling the cells of a grid on vellum. -->
  <defs>
    <radialGradient id="vellum" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#f7efdc"/>
      <stop offset="0.7" stop-color="#eadcbc"/>
      <stop offset="1" stop-color="#d4bd8f"/>
    </radialGradient>
    <!-- Fresh blue-black ink at the top, aged rust-brown at the bottom. -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f3d"/>
      <stop offset="0.55" stop-color="#23233a"/>
      <stop offset="1" stop-color="#4f2e1b"/>
    </linearGradient>
    <clipPath id="drop">
      <path d="M256 84 C296 156 384 228 384 322 A128 128 0 0 1 128 322 C128 228 216 156 256 84 Z"/>
    </clipPath>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="84" fill="url(#vellum)"/>
  <rect x="36" y="36" width="440" height="440" rx="62" fill="none" stroke="#a8432a" stroke-width="6"/>

  <!-- The grid, faint on the vellum. -->
  <g stroke="#cdbd98" stroke-width="3">
    <path d="M88 88V424 M136 88V424 M184 88V424 M232 88V424 M280 88V424 M328 88V424 M376 88V424 M424 88V424"/>
    <path d="M88 88H424 M88 136H424 M88 184H424 M88 232H424 M88 280H424 M88 328H424 M88 376H424 M88 424H424"/>
  </g>

  <!-- The drop, cut into cells by the same grid. -->
  <!-- clip-path sits on each shape: Godot's SVG renderer drops strokes in a clipped group. -->
  <rect x="96" y="64" width="320" height="400" fill="url(#ink)" clip-path="url(#drop)"/>
  <rect x="184" y="280" width="48" height="48" fill="#4c5c94" clip-path="url(#drop)"/>
  <path clip-path="url(#drop)" stroke="#efe4cc" stroke-width="5" fill="none"
        d="M88 40V472 M136 40V472 M184 40V472 M232 40V472 M280 40V472 M328 40V472 M376 40V472 M424 40V472 M40 88H472 M40 136H472 M40 184H472 M40 232H472 M40 280H472 M40 328H472 M40 376H472 M40 424H472"/>
</svg>
